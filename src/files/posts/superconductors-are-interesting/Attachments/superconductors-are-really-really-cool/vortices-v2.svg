<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Magnetic vortices in a Type II superconductor</title><desc id="desc">Flux penetrates the mixed state in vortices surrounded by circulating supercurrent. A vortex has a core on the coherence-length scale and a magnetic field extending over the penetration-depth scale. Each isolated singly quantized vortex carries h over 2e flux.</desc>
<defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#277bb5" stroke-width="1.5"/></marker><marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#117e79" stroke-width="1.5"/></marker><radialGradient id="field"><stop offset="0" stop-color="#277bb5" stop-opacity=".25"/><stop offset="1" stop-color="#277bb5" stop-opacity=".02"/></radialGradient></defs>
<rect width="1100" height="560" fill="white"/>
<g font-family="Arial, sans-serif" fill="#182b39"><text x="40" y="43" font-size="25" font-weight="700">Let the field through—in quantized vortices</text><text x="40" y="76" font-size="16" fill="#526572">Type II mixed state: superconductivity persists between the vortex cores</text>
<text x="80" y="122" font-size="20" font-weight="700">Side view</text><text x="680" y="122" font-size="20" font-weight="700">One vortex, viewed end-on</text>
<path d="M95 225L160 190H474V385L409 420H95Z" fill="#e5f3f0" stroke="#78b4aa" stroke-width="2"/><path d="M95 225H409L474 190M409 225V420" fill="none" stroke="#78b4aa" stroke-width="2"/>
<g fill="#c5b3e8" stroke="#8766b4" stroke-width="1.5"><path d="M171 220V400C171 413 195 413 195 400V220Z"/><ellipse cx="183" cy="220" rx="12" ry="5"/><path d="M269 220V400C269 413 293 413 293 400V220Z"/><ellipse cx="281" cy="220" rx="12" ry="5"/><path d="M367 220V400C367 413 391 413 391 400V220Z"/><ellipse cx="379" cy="220" rx="12" ry="5"/></g>
<g fill="none" stroke="#277bb5" stroke-width="2.5" marker-end="url(#b)"><path d="M183 463V156"/><path d="M281 463V156"/><path d="M379 463V156"/></g>
<text x="100" y="495" font-size="15">Flux extends around each core, too.</text>
<circle cx="815" cy="305" r="142" fill="url(#field)"/><circle cx="815" cy="305" r="142" fill="none" stroke="#9ebfda" stroke-dasharray="5 5"/><circle cx="815" cy="305" r="27" fill="#d4c5ed" stroke="#7451a8" stroke-width="2"/>
<g fill="none" stroke="#117e79" stroke-width="2.5" marker-end="url(#c)"><path d="M755 335A67 67 0 1 0 788 244"/><path d="M717 350A108 108 0 1 0 769 208"/></g>
<circle cx="815" cy="305" r="4" fill="#277bb5"/><circle cx="815" cy="305" r="10" fill="none" stroke="#277bb5" stroke-width="2"/>
<path d="M815 305H842" fill="none" stroke="#7451a8" stroke-width="2"/><text x="849" y="311" font-size="17" fill="#7451a8">core ~ ξ</text>
<path d="M815 305L915 205" fill="none" stroke="#277bb5" stroke-width="1.5"/><text x="924" y="200" font-size="17" fill="#277bb5">field scale ~ λ</text>
<text x="690" y="480" font-size="18" fill="#117e79">Circulating supercurrent</text><text x="680" y="511" font-size="18">Φ₀ = h/(2e) ≈ 2.07 × 10⁻¹⁵ Wb</text>
<text x="40" y="542" font-size="15" fill="#526572">Schematic; not to scale. The magnetic field has no sharp outer boundary. Core: superconducting order is suppressed.</text></g>
</svg>
